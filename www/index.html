<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID PASSWORD MEMBER CIMANGCU</title>

<style>
:root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --text: #212529;
    --border: #dee2e6;
    --primary: #0d6efd;
    --danger: #dc3545;
    --secondary: #6c757d;
}
body.dark {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #e0e0e0;
    --border: #333333;
    --primary: #3d8bfd;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 700px;
    margin: auto;
    padding: 15px;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
}
input, button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    font-size: 15px;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
}
button {
    cursor: pointer;
    background: var(--primary);
    color: #fff;
    font-weight: bold;
    border: none;
    transition: opacity 0.2s;
}
button:hover { opacity: 0.9; }
button.secondary { background: var(--secondary); }
button.danger { background: var(--danger); }
button.small { width: auto; padding: 8px 14px; font-size: 14px; }

.item {
    display: flex;
    gap: 6px;
    margin: 6px 0;
}
.item input {
    flex: 1;
    margin: 0;
}
.item button {
    width: 48px;
    margin: 0;
    flex-shrink: 0;
}

.search-box {
    position: relative;
}

.stats {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}
.stat-box {
    background: var(--card);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
    flex: 1;
}
.stat-box h4 {
    margin: 0;
    font-size: 12px;
    opacity: 0.7;
}
.stat-box p {
    margin: 5px 0 0;
    font-size: 20px;
    font-weight: bold;
}

.toolbar {
    display: flex;
    gap: 8px;
    margin: 10px 0;
    flex-wrap: wrap;
}
.toolbar button {
    flex: 1;
    min-width: 120px;
}

.status {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 6px;
    font-weight: 500;
    display: none;
}
.status.show { display: block; }
.status.success { background: #d1e7dd; color: #0f5132; }
.status.error { background: #f8d7da; color: #842029; }
body.dark .status.success { background: #0f5132; color: #d1e7dd; }
body.dark .status.error { background: #842029; color: #f8d7da; }

#darkToggle {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    font-size: 18px;
    padding: 0;
    z-index: 999;
}
.empty-state {
    text-align: center;
    padding: 25px;
    color: #888;
    font-size: 14px;
}
</style>
</head>
<body>

<button id="darkToggle" onclick="toggleDark()">🌙</button>

<h2>GitHub JSON Editor</h2>

<input id="token" type="password" placeholder="GitHub Token (ghp_xxx atau github_pat_xxx)">
<input id="owner" value="yuwanaroy-cpu">
<input id="repo" value="password">
<input id="path" value="member.json">
<input id="msg" value="Update member.json">

<button onclick="loadJSON()">📥 Load dari GitHub</button>

<div class="status" id="status"></div>

<hr>

<div class="stats">
    <div class="stat-box">
        <h4>Total ID</h4>
        <p id="stat-total">0</p>
    </div>
    <div class="stat-box">
        <h4>Tampil</h4>
        <p id="stat-shown">0</p>
    </div>
</div>

<div class="search-box">
    <input id="search" type="text" placeholder="🔍 Cari ID..." oninput="render()">
</div>

<div class="toolbar">
    <button class="secondary small" onclick="sortIDs()">A-Z Sort</button>
    <button class="secondary small" onclick="removeDuplicates()">🧹 Hapus Duplikat</button>
    <button class="danger small" onclick="clearAll()">🗑️ Hapus Semua</button>
</div>

<div id="list"></div>

<div id="empty" class="empty-state" style="display:none;">
    Tidak ada ID yang cocok dengan pencarian.
</div>

<input id="newid" placeholder="ID baru" onkeydown="if(event.key==='Enter') addID()">

<div class="toolbar">
    <button onclick="addID()">➕ Tambah ID</button>
    <button onclick="saveJSON()">💾 Save ke GitHub</button>
</div>

<script>
let jsonData = { allowed_ids: [] };
let sha = "";

function toggleDark() {
    document.body.classList.toggle("dark");
    const isDark = document.body.classList.contains("dark");
    localStorage.setItem("darkmode", isDark ? "1" : "0");
    document.getElementById("darkToggle").innerText = isDark ? "☀️" : "🌙";
}

function setStatus(msg, type) {
    const el = document.getElementById("status");
    el.innerText = msg;
    el.className = "status show " + type;
    setTimeout(() => { el.className = "status"; }, 3500);
}

function getSearchTerm() {
    return document.getElementById("search").value.toLowerCase().trim();
}

function getFilteredIds() {
    const ids = jsonData.allowed_ids || [];
    const term = getSearchTerm();
    
    return ids
        .map((val, idx) => ({ value: val, originalIndex: idx }))
        .filter(item => !term || item.value.toLowerCase().includes(term));
}

function render() {
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const filtered = getFilteredIds();

    document.getElementById("stat-total").innerText = (jsonData.allowed_ids || []).length;
    document.getElementById("stat-shown").innerText = filtered.length;

    if (filtered.length === 0 && (jsonData.allowed_ids || []).length > 0) {
        empty.style.display = "block";
        list.innerHTML = "";
        return;
    }
    empty.style.display = "none";

    let html = "";
    filtered.forEach((item) => {
        const v = escapeHtml(item.value);
        const idx = item.originalIndex; // Menggunakan indeks asli array

        html += `
        <div class="item">
            <input value="${v}" onchange="updateID(${idx}, this.value)">
            <button class="secondary" onclick="copyID('${v}')" title="Salin ID">📋</button>
            <button class="danger" onclick="hapus(${idx})" title="Hapus">X</button>
        </div>
        `;
    });

    list.innerHTML = html;
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function updateID(index, newValue) {
    if (!jsonData.allowed_ids) jsonData.allowed_ids = [];
    jsonData.allowed_ids[index] = newValue.trim();
    render();
    setStatus("ID diperbarui", "success");
}

function hapus(index) {
    const itemTarget = jsonData.allowed_ids[index];
    if (!confirm(`Hapus ID: "${itemTarget}"?`)) return;
    
    jsonData.allowed_ids.splice(index, 1);
    render();
    setStatus("ID dihapus", "success");
}

function addID() {
    const input = document.getElementById("newid");
    const val = input.value.trim();
    
    if (!val) {
        setStatus("ID tidak boleh kosong", "error");
        return;
    }
    if (!jsonData.allowed_ids) jsonData.allowed_ids = [];
    if (jsonData.allowed_ids.includes(val)) {
        setStatus("ID sudah ada: " + val, "error");
        return;
    }
    
    jsonData.allowed_ids.push(val);
    input.value = "";
    document.getElementById("search").value = "";
    render();
    setStatus("ID ditambahkan: " + val, "success");
}

function sortIDs() {
    if (!jsonData.allowed_ids) return;
    jsonData.allowed_ids.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
    render();
    setStatus("ID berhasil diurutkan A-Z", "success");
}

function removeDuplicates() {
    if (!jsonData.allowed_ids) return;
    const before = jsonData.allowed_ids.length;
    jsonData.allowed_ids = [...new Set(jsonData.allowed_ids)];
    const after = jsonData.allowed_ids.length;
    render();
    setStatus(`Duplikat dihapus: ${before - after} item`, "success");
}

function clearAll() {
    if (!jsonData.allowed_ids || jsonData.allowed_ids.length === 0) return;
    if (!confirm(`Hapus seluruh ${jsonData.allowed_ids.length} ID?`)) return;
    jsonData.allowed_ids = [];
    render();
    setStatus("Semua ID telah dihapus", "success");
}

async function copyID(text) {
    try {
        await navigator.clipboard.writeText(text);
        setStatus("📋 ID disalin: " + text, "success");
    } catch (e) {
        // Fallback untuk browser lama
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        setStatus("📋 ID disalin: " + text, "success");
    }
}

async function loadJSON() {
    const token = document.getElementById("token").value.trim();
    const owner = document.getElementById("owner").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const path = document.getElementById("path").value.trim();

    if (!token) { setStatus("Token GitHub wajib diisi", "error"); return; }

    try {
        const r = await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${path}`,
            {
                headers: {
                    Authorization: "Bearer " + token,
                    Accept: "application/vnd.github+json"
                }
            }
        );

        if (r.status === 401) throw new Error("Token tidak valid / tidak punya akses");
        if (r.status === 404) throw new Error("File atau repositori tidak ditemukan");
        if (!r.ok) throw new Error("HTTP Status " + r.status);

        const d = await r.json();
        sha = d.sha;

        // Decode base64 UTF-8 secara aman
        const cleanContent = d.content.replace(/\s/g, "");
        const bytes = Uint8Array.from(atob(cleanContent), c => c.charCodeAt(0));
        const text = new TextDecoder().decode(bytes);

        jsonData = JSON.parse(text);
        if (!Array.isArray(jsonData.allowed_ids)) {
            jsonData.allowed_ids = [];
        }

        document.getElementById("search").value = "";
        render();
        setStatus(`✅ Berhasil memuat ${jsonData.allowed_ids.length} ID`, "success");
        localStorage.setItem("github_token", token);
    } catch (e) {
        setStatus("❌ " + e.message, "error");
    }
}

async function saveJSON() {
    const token = document.getElementById("token").value.trim();
    const owner = document.getElementById("owner").value.trim();
    const repo = document.getElementById("repo").value.trim();
    const path = document.getElementById("path").value.trim();
    const msg = document.getElementById("msg").value.trim();

    if (!token) { setStatus("Token GitHub wajib diisi", "error"); return; }
    if (!sha) { setStatus("Silakan Load JSON terlebih dahulu!", "error"); return; }

    // Pembersihan data sebelum disimpan
    jsonData.allowed_ids = [...new Set(
        (jsonData.allowed_ids || [])
            .map(x => (x || "").trim())
            .filter(x => x !== "")
    )];

    try {
        const text = JSON.stringify(jsonData, null, 2);
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        bytes.forEach(b => binary += String.fromCharCode(b));
        const content = btoa(binary);

        const body = { message: msg, content: content, sha: sha };

        const r = await fetch(
            `https://api.github.com/repos/${owner}/${repo}/contents/${path}`,
            {
                method: "PUT",
                headers: {
                    Authorization: "Bearer " + token,
                    Accept: "application/vnd.github+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            }
        );

        if (r.ok) {
            const result = await r.json();
            sha = result.content.sha; // Update SHA terbaru setelah simpan
            render();
            setStatus(`✅ Tersimpan ke GitHub! (${jsonData.allowed_ids.length} ID)`, "success");
        } else if (r.status === 409) {
            setStatus("Gagal simpan: Konflik SHA. Silakan Load ulang.", "error");
        } else {
            setStatus("Gagal simpan: HTTP " + r.status, "error");
        }
    } catch (e) {
        setStatus("❌ " + e.message, "error");
    }
}

// Inisialisasi awal
window.onload = function() {
    const savedToken = localStorage.getItem("github_token");
    if (savedToken) document.getElementById("token").value = savedToken;

    if (localStorage.getItem("darkmode") === "1") {
        document.body.classList.add("dark");
        document.getElementById("darkToggle").innerText = "☀️";
    }
};
</script>
</body>
</html>
